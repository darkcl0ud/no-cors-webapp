type: object
required:
  - name
  - description
  - id
properties:
  name:
    minLength: 1
    maxLength: 128
    type: string
    description: The name of the movie.
  description:
    minLength: 1
    maxLength: 1024
    type: string
    description: The description of the movie.
  id:
    type: string
    description: The unique identifier of the movie.
    pattern: ^[a-fA-F\d]{8}(?:\-[a-fA-F\d]{4}){3}\-[a-fA-F\d]{12}$